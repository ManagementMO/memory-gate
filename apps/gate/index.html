<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Step back into a moment with a gentle companion. Speak or share a photo; the place forms around you." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.45' stop-color='%23b9a6ff'/%3E%3Cstop offset='1' stop-color='%2305060d' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>Memora</title>
    <style>
      /* Shown from the first byte until the experience is ready (a headset on a slow connection can take a while). */
      html, body { margin: 0; background: #04050c; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 22px; color: #d9d6f2;
        font: 400 17px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.01em; text-align: center; padding: 24px; }
      .boot i { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle, #fff6e2 0, #ffcf8a 30%, rgba(255, 190, 110, 0) 70%);
        animation: boot-breathe 2.6s ease-in-out infinite; }
      .boot small { display: block; margin-top: 6px; font-size: 14px; color: #8f8cab; min-height: 1.4em; }
      .boot button { font: inherit; font-size: 15px; color: #04050c; background: #f3eedf; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
      @keyframes boot-breathe { 0%, 100% { transform: scale(0.82); opacity: 0.65; } 50% { transform: scale(1.08); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><i></i><div>Opening the gate…</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
